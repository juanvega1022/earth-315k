name: Simulation tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the simulation and run its tests
        run: |
          cmake -S Simulation -B Simulation/build -DCMAKE_BUILD_TYPE=Release
          cmake --build Simulation/build -j
          ctest --test-dir Simulation/build --output-on-failure
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test elevation script
        run: |
          pip install -r tools/requirements.txt
          python tests/test_prepare_elevation.py
